name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tooling tests
        run: cargo test --workspace

      - name: Validate content
        run: cargo run --quiet -p sop-cli -- validate

      - name: Build manifest
        run: cargo run --quiet -p sop-cli -- index

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: field-sop-manifest
          path: dist/manifest.json

  # Build the installable desktop app. Ubuntu 22.04 is the oldest release that must be
  # supported, and a binary built there also runs on 24.04 (DESIGN.md section 7).
  bundle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev build-essential curl file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the renderer
        run: |
          cd ui && npm ci && npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the .deb and AppImage
        run: cargo tauri build --bundles deb,appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: field-sop-bundle
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  # Transitional, and deleted with tools/ once the Rust CLI has been trusted in the field
  # for a while. It is kept in CI so that a divergence between the two implementations
  # fails the build instead of passing silently. See docs/DECISIONS.md D11.
  python-cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Validate content
        run: python3 tools/validate.py

      - name: Validator negative tests
        run: python3 tools/selftest.py
