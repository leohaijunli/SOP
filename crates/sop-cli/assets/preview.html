<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>field-sop preview</title>
<style>
  :root {
    --bg: #f6f7f5;
    --panel: #ffffff;
    --ink: #1b1d1a;
    --muted: #6b7069;
    --line: #d8dbd5;
    --accent: #1f6f4a;
    --critical: #a4322b;
    --warn: #8a6100;
    --quote: #f0f2ee;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  header .tag {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px;
  }
  header .spacer { flex: 1; }
  header .counts { color: var(--muted); font-size: 13px; }
  kbd {
    font: 12px var(--mono); background: var(--quote); border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 4px; padding: 0 5px;
  }

  main { flex: 1; display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 0; }
  main.with-help { grid-template-columns: 300px minmax(0, 1fr) minmax(320px, 27vw); }

  nav, article, aside { min-height: 0; overflow: auto; padding: 16px; }
  nav { background: var(--panel); border-right: 1px solid var(--line); }
  aside { background: var(--panel); border-left: 1px solid var(--line); }
  nav h2, aside h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 18px 0 8px;
  }
  nav h2:first-child, aside h2:first-child { margin-top: 0; }

  select, input[type=search] {
    width: 100%; font: inherit; padding: 7px 9px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--bg); color: var(--ink);
  }

  ol.steps { list-style: none; margin: 12px 0 0; padding: 0; }
  ol.steps li {
    padding: 8px 10px; border-radius: 6px; cursor: pointer;
    border-left: 3px solid transparent;
  }
  ol.steps li:hover { background: var(--quote); }
  ol.steps li[aria-current="true"] { background: var(--quote); border-left-color: var(--accent); }
  ol.steps .no { font: 12px var(--mono); color: var(--muted); margin-right: 6px; }
  ol.steps .title { display: block; }
  ol.steps .meta { font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .dot.critical { background: var(--critical); }
  .dot.info { background: var(--muted); }
  .dot.normal { background: var(--accent); }

  article h1 { font-size: 24px; margin: 0 0 6px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .badge {
    font-size: 12px; border: 1px solid var(--line); border-radius: 999px;
    padding: 1px 9px; color: var(--muted); background: var(--panel);
  }
  .badge.critical { color: var(--critical); border-color: #e4c6c3; }
  .badge.info { color: var(--muted); }

  section.captures { margin: 0 0 22px; }
  section.captures h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .capture {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .capture .label { font-weight: 600; }
  .capture .req { color: var(--critical); margin-left: 4px; }
  .capture .hint { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .capture .control {
    margin-top: 8px; padding: 7px 9px; border: 1px dashed var(--line);
    border-radius: 6px; color: var(--muted); font-size: 13px; background: var(--bg);
  }
  .capture .expected { margin-top: 8px; font-size: 13px; color: var(--warn); }

  .prose { max-width: 68ch; }
  .prose h1 { font-size: 20px; margin: 24px 0 8px; }
  .prose h2 { font-size: 18px; margin: 24px 0 8px; }
  .prose h3 { font-size: 16px; margin: 20px 0 8px; }
  .prose p { margin: 0 0 12px; }
  .prose ul, .prose ol { margin: 0 0 12px; padding-left: 22px; }
  .prose li { margin-bottom: 4px; }
  .prose li.task { list-style: none; margin-left: -22px; }
  .prose code { font: 13px var(--mono); background: var(--quote); padding: 1px 4px; border-radius: 4px; }
  .prose pre {
    background: var(--quote); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto;
  }
  .prose pre code { background: none; padding: 0; }
  .prose blockquote {
    margin: 0 0 12px; padding: 6px 12px; border-left: 3px solid var(--line);
    background: var(--quote); color: var(--muted);
  }
  .prose table { border-collapse: collapse; margin: 0 0 14px; font-size: 14px; }
  .prose th, .prose td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  .prose th { background: var(--quote); }
  .prose hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
  .prose a { color: var(--accent); }

  .help-index { list-style: none; margin: 0; padding: 0; }
  .help-index li {
    padding: 7px 9px; border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  .help-index li:hover { background: var(--quote); }
  .help-index li[aria-current="true"] { background: var(--quote); font-weight: 600; }
  #helptitle {
    font-size: 17px; letter-spacing: 0; text-transform: none; color: var(--ink);
    margin: 20px 0 10px; padding-top: 16px; border-top: 1px solid var(--line);
  }
  #helptitle:empty { display: none; }

  .notice {
    background: #fff8e6; border: 1px solid #ecdca8; border-radius: 8px;
    padding: 9px 12px; font-size: 13px; margin-bottom: 18px;
  }
  .empty { color: var(--muted); }
  @media (max-width: 1100px) {
    main, main.with-help { grid-template-columns: 260px minmax(0, 1fr); }
    aside { display: none; }
    main.with-help aside { display: block; position: fixed; inset: 49px 0 0 auto; width: min(520px, 92vw); box-shadow: -8px 0 24px rgba(0,0,0,.08); }
  }
</style>
</head>
<body>
<header>
  <h1 id="projectname">field-sop</h1>
  <span class="tag">preview</span>
  <span class="counts" id="counts"></span>
  <span class="spacer"></span>
  <span class="counts">
    <kbd>j</kbd>/<kbd>k</kbd> step &middot; <kbd>F1</kbd> help &middot; <kbd>/</kbd> search help
  </span>
</header>

<main id="main">
  <nav>
    <label for="checklist">Checklist</label>
    <select id="checklist"></select>
    <label for="stepfilter" style="display:block;margin-top:12px">Filter steps</label>
    <input id="stepfilter" type="search" placeholder="id, title, or kind">
    <h2>Steps</h2>
    <ol class="steps" id="steps"></ol>
  </nav>

  <article id="detail"></article>

  <aside id="help">
    <input id="helpsearch" type="search" placeholder="Search help  (press /)">
    <h2>Pages</h2>
    <ul class="help-index" id="helpindex"></ul>
    <h2 id="helptitle"></h2>
    <div class="prose" id="helpbody"></div>
  </aside>
</main>

<script>
"use strict";

// --------------------------------------------------------------- markdown

const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function inline(text) {
  let out = escapeHtml(text);
  out = out.replace(/`([^`]+)`/g, (_, code) => `<code>${code}</code>`);
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  out = out.replace(/\[([^\]]*)\]\(([^)\s]+)\)/g, (_, label, href) => `<a href="${href}">${label}</a>`);
  return out;
}

// A deliberately small Markdown subset: enough for the content in this repository, and
// no more: fenced code, hr, h1-h4, tables, blockquotes, and lists.
function markdown(source) {
  const lines = source.split("\n");
  const html = [];
  let index = 0;

  const flushParagraph = (buffer) => {
    if (buffer.length) html.push(`<p>${inline(buffer.join(" "))}</p>`);
    buffer.length = 0;
  };

  while (index < lines.length) {
    const line = lines[index];

    if (/^\s*```/.test(line)) {
      const ticks = line.match(/^\s*`+/)[0].trim().length;
      const body = [];
      index++;
      while (index < lines.length && !new RegExp(`^\\s*\`{${ticks},}\\s*$`).test(lines[index])) body.push(lines[index++]);
      index++;
      html.push(`<pre><code>${escapeHtml(body.join("\n"))}</code></pre>`);
      continue;
    }

    if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { html.push("<hr>"); index++; continue; }

    const heading = line.match(/^(#{1,4})\s+(.*)$/);
    if (heading) { html.push(`<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`); index++; continue; }

    if (/^\s*\|/.test(line) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[index + 1] || "")) {
      const cells = (row) => row.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const head = cells(line);
      index += 2;
      const body = [];
      while (index < lines.length && /^\s*\|/.test(lines[index])) body.push(cells(lines[index++]));
      html.push(
        `<table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead>` +
        `<tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`
      );
      continue;
    }

    if (/^\s*>\s?/.test(line)) {
      const body = [];
      while (index < lines.length && /^\s*>\s?/.test(lines[index])) body.push(lines[index++].replace(/^\s*>\s?/, ""));
      html.push(`<blockquote>${markdown(body.join("\n"))}</blockquote>`);
      continue;
    }

    const bullet = line.match(/^(\s*)[-*+]\s+(.*)$/);
    const numbered = line.match(/^(\s*)\d+[.)]\s+(.*)$/);
    if (bullet || numbered) {
      const ordered = Boolean(numbered);
      const items = [];
      while (index < lines.length) {
        const m = lines[index].match(ordered ? /^\s*\d+[.)]\s+(.*)$/ : /^\s*[-*+]\s+(.*)$/);
        if (!m) break;
        const task = m[1].match(/^\[([ xX])\]\s+(.*)$/);
        items.push(task
          ? `<li class="task"><input type="checkbox" disabled${task[1] === " " ? "" : " checked"}> ${inline(task[2])}</li>`
          : `<li>${inline(m[1])}</li>`);
        index++;
      }
      html.push(`<${ordered ? "ol" : "ul"}>${items.join("")}</${ordered ? "ol" : "ul"}>`);
      continue;
    }

    if (!line.trim()) { index++; continue; }

    const paragraph = [];
    while (index < lines.length && lines[index].trim() && !/^\s*(```|>|[-*+]\s|\d+[.)]\s|\||#{1,4}\s)/.test(lines[index])) {
      paragraph.push(lines[index++]);
    }
    flushParagraph(paragraph);
    void flushParagraph;
  }

  return html.join("\n");
}

// ------------------------------------------------------------------- app

const state = { manifest: null, checklist: 0, step: 0, help: null, helpQuery: "", stepQuery: "" };

const el = (id) => document.getElementById(id);
const text = (value) => (value === null || value === undefined ? "" : String(value));
const byId = (id) => (state.manifest.help || []).find((page) => text(page.help_id) === id);

function visibleSteps() {
  const steps = state.manifest.checklists[state.checklist].steps;
  const query = state.stepQuery.trim().toLowerCase();
  if (!query) return steps.map((step, index) => ({ step, index }));
  return steps
    .map((step, index) => ({ step, index }))
    .filter(({ step }) =>
      [step.id, step.title, step.kind, step.severity].some((field) => text(field).toLowerCase().includes(query)));
}

function renderHeader() {
  const m = state.manifest;
  // The project's name is repository content, so the header reads it from project.md
  // rather than from anything this viewer knows about itself.
  const project = m.project && m.project.title ? text(m.project.title) : "field-sop";
  el("projectname").textContent = project;
  el("projectname").title = m.project && m.project.project_id ? text(m.project.project_id) : "";
  el("counts").textContent =
    `${m.procedures.length} procedures \u00b7 ${m.checklists.length} checklists \u00b7 ${m.runs.length} runs \u00b7 ${m.help.length} help pages`;
}

function renderChecklistPicker() {
  const select = el("checklist");
  select.innerHTML = state.manifest.checklists
    .map((c, i) => `<option value="${i}">${text(c.title)} (${text(c.sop_id)}) \u00b7 ${c.step_count} steps</option>`)
    .join("");
  select.value = String(state.checklist);
  select.onchange = () => { state.checklist = Number(select.value); state.step = 0; renderAll(); };
}

function renderSteps() {
  const list = el("steps");
  const rows = visibleSteps();
  if (!rows.length) { list.innerHTML = `<li class="empty">no matching steps</li>`; return; }
  list.innerHTML = rows
    .map(({ step, index }) => `
      <li data-index="${index}" aria-current="${index === state.step}">
        <span class="title"><span class="dot ${text(step.severity)}"></span>
          <span class="no">${index + 1}</span>${text(step.title)}</span>
        <span class="meta">${text(step.kind)}${step.deprecated ? " \u00b7 deprecated" : ""} \u00b7 ${text(step.id)}</span>
      </li>`)
    .join("");
  for (const li of list.querySelectorAll("li[data-index]")) {
    li.onclick = () => { state.step = Number(li.dataset.index); renderAll(); };
  }
}

function expectedText(capture) {
  const e = capture.expected;
  if (e === null || e === undefined) return "";
  if (typeof e === "object" && ("min" in e || "max" in e)) {
    const min = "min" in e ? e.min : "\u2212\u221e";
    const max = "max" in e ? e.max : "\u221e";
    return `expected between ${min} and ${max}`;
  }
  return `expected ${e}`;
}

function renderDetail() {
  const checklist = state.manifest.checklists[state.checklist];
  const step = checklist.steps[state.step];
  const detail = el("detail");
  if (!step) { detail.innerHTML = `<p class="empty">This checklist has no steps.</p>`; return; }

  const notes = mathNotices();
  const captures = (step.captures || []).map((capture) => {
    const expected = expectedText(capture);
    const hint = [
      text(capture.type),
      capture.unit ? text(capture.unit) : "",
      capture.options ? `one of ${capture.options.map((o) => JSON.stringify(o)).join(", ")}` : "",
    ].filter(Boolean).join(" \u00b7 ");
    return `
      <div class="capture">
        <div class="label">${text(capture.label)}${capture.required ? '<span class="req">*</span>' : ""}</div>
        <div class="hint">${text(capture.key)} \u00b7 ${hint}</div>
        <div class="control">recording arrives with the app</div>
        ${expected ? `<div class="expected">${escapeHtml(expected)} \u2014 highlighted, never judged</div>` : ""}
      </div>`;
  }).join("");

  detail.innerHTML = `
    ${notes}
    <h1>${text(step.title)}</h1>
    <div class="badges">
      <span class="badge ${text(step.severity)}">${text(step.severity)}</span>
      <span class="badge">${text(step.kind)}</span>
      ${step.deprecated ? '<span class="badge">deprecated</span>' : ""}
      <span class="badge">${text(step.id)}</span>
      <span class="badge">from ${text(step.source)}</span>
    </div>
    ${captures ? `<section class="captures"><h2>Captures</h2>${captures}</section>` : ""}
    <div class="prose">${markdown(text(step.body))}</div>`;
}

function mathNotices() {
  return `<div class="notice">
    Read-only preview of the layout, driven by <code>dist/manifest.json</code>.
    Browsing works; recording does not exist yet.
  </div>`;
}

function renderHelp() {
  const pages = state.manifest.help || [];
  const query = state.helpQuery.trim().toLowerCase();
  const matches = query
    ? pages.filter((page) => [page.title, page.summary, page.section, page.body, (page.tags || []).join(" ")]
        .some((field) => text(field).toLowerCase().includes(query)))
    : pages;

  if (!pages.length) {
    el("helpindex").innerHTML = `<li class="empty">no help pages</li>`;
    return;
  }
  if (!matches.length) {
    el("helpindex").innerHTML = `<li class="empty">no matching pages</li>`;
    return;
  }
  if (!state.help || !byId(state.help)) state.help = matches[0].help_id;

  let section = null;
  const rows = [];
  for (const page of matches) {
    if (page.section !== section) {
      section = page.section;
      rows.push(`<li class="empty" style="cursor:default;font-size:11px;text-transform:uppercase;letter-spacing:.08em">${text(section)}</li>`);
    }
    rows.push(`<li data-help="${text(page.help_id)}" aria-current="${page.help_id === state.help}">${text(page.title)}</li>`);
  }
  el("helpindex").innerHTML = rows.join("");
  for (const li of el("helpindex").querySelectorAll("li[data-help]")) {
    li.onclick = () => { state.help = li.dataset.help; renderAll(); el("helptitle").scrollIntoView(); };
  }

  const page = byId(state.help);
  el("helptitle").textContent = text(page.title);
  el("helpbody").innerHTML = markdown(text(page.body));
}

function toggleHelp(force) {
  const main = el("main");
  const open = force !== undefined ? force : !main.classList.contains("with-help");
  main.classList.toggle("with-help", open);
  el("help").style.display = open ? "" : "none";
  if (open) el("helpsearch").focus();
}

// Deep links: #<sop_id>/<step index>/<help id>. Enough to bookmark a step, or to send
// somebody the page they should read.
function readHash() {
  const [sopId, step, helpId] = location.hash.replace(/^#/, "").split("/");
  const manifest = state.manifest;
  if (sopId) {
    const index = manifest.checklists.findIndex((c) => text(c.sop_id) === sopId);
    if (index >= 0) state.checklist = index;
  }
  const steps = manifest.checklists[state.checklist].steps;
  if (step !== undefined && step !== "") {
    // A step id survives editing the checklist and an index does not, so the id is tried
    // first. An index is still accepted because a position is easier to type by hand.
    const byId = steps.findIndex((candidate) => text(candidate.id) === step);
    const index = Number(step);
    if (byId >= 0) state.step = byId;
    else if (Number.isInteger(index) && index >= 0 && index < steps.length) state.step = index;
  }
  if (helpId) state.help = helpId;
}

function writeHash() {
  const checklist = state.manifest.checklists[state.checklist];
  const parts = [text(checklist.sop_id), String(state.step)];
  if (state.help) parts.push(text(state.help));
  history.replaceState(null, "", `#${parts.join("/")}`);
}

document.addEventListener("keydown", (event) => {
  if (event.target.matches("input, select, textarea")) {
    if (event.key === "Escape") event.target.blur();
    return;
  }
  const steps = state.manifest.checklists[state.checklist].steps;
  if (event.key === "F1") { event.preventDefault(); toggleHelp(); }
  else if (event.key === "/") { event.preventDefault(); toggleHelp(true); }
  else if (event.key === "j" && state.step < steps.length - 1) { state.step++; renderAll(); }
  else if (event.key === "k" && state.step > 0) { state.step--; renderAll(); }
  else if (event.key === "?") { event.preventDefault(); toggleHelp(true); state.help = (state.manifest.help[0] || {}).help_id; state.helpQuery = ""; el("helpsearch").value = ""; renderHelp(); }
});

el("stepfilter").addEventListener("input", (event) => { state.stepQuery = event.target.value; renderSteps(); });
el("helpsearch").addEventListener("input", (event) => { state.helpQuery = event.target.value; renderHelp(); });

function renderAll() {
  renderChecklistPicker();
  renderSteps();
  renderDetail();
  renderHelp();
  writeHash();
}

window.addEventListener("hashchange", () => { readHash(); renderAll(); });

fetch("/manifest.json")
  .then((response) => response.json())
  .then((manifest) => {
    state.manifest = manifest;
    renderHeader();
    readHash();
    toggleHelp(true);
    renderAll();
  })
  .catch((error) => {
    document.body.innerHTML = `<p style="padding:24px">Could not load the manifest: ${escapeHtml(String(error))}</p>`;
  });
</script>
</body>
</html>
