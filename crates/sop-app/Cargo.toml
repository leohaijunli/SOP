[package]
name = "sop-app"
description = "The field-sop desktop application: run a checklist and edit the content."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "field-sop"
path = "src/main.rs"

[dependencies]
sop-core.workspace = true
sop-repo.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Local-time formatting for the exported summary lives only in this shell; `sop-core`
# and `sop-repo` stay free of a clock. `default-features = false` keeps the formatting
# to the system clock only, no `serde` or `unstable-locales`.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
